[package]
name = "revoked-vesting-claim"
version = "0.1.0"
edition = "2021"
description = "Vulnerable Soroban contract demonstrating vesting revocation that doesn't actually stop the vesting curve"
license = "MIT"
repository = "https://github.com/Veritas-Vaults-Network/soroban-guard-contracts"

[lib]
crate-type = ["cdylib"]

[dependencies]
soroban-sdk = { workspace = true }

[dev-dependencies]
soroban-sdk = { workspace = true, features = ["testutils"] }
