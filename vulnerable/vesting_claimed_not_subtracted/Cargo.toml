[package]
name = "vesting-claimed-not-subtracted"
version = "0.1.0"
edition = "2021"
description = "Vulnerable Soroban contract demonstrating a vesting claim that never persists its own running total"
license = "MIT"
repository = "https://github.com/Veritas-Vaults-Network/soroban-guard-contracts"

[lib]
crate-type = ["cdylib"]

[dependencies]
soroban-sdk = { workspace = true }

[dev-dependencies]
soroban-sdk = { workspace = true, features = ["testutils"] }
