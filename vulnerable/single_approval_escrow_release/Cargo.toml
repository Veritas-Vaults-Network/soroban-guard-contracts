[package]
name = "single-approval-escrow-release"
version = "0.1.0"
edition = "2021"
description = "Vulnerable Soroban contract demonstrating an N-of-M multisig escrow whose release threshold check is hardcoded to 1"
license = "MIT"
repository = "https://github.com/Veritas-Vaults-Network/soroban-guard-contracts"

[lib]
crate-type = ["cdylib"]

[dependencies]
soroban-sdk = { workspace = true }

[dev-dependencies]
soroban-sdk = { workspace = true, features = ["testutils"] }
