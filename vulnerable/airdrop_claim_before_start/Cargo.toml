[package]
name = "airdrop-claim-before-start"
version = "0.1.0"
edition = "2021"
description = "Vulnerable Soroban contract demonstrating a missing start-time check in a time-gated merkle airdrop"
license = "MIT"
repository = "https://github.com/Veritas-Vaults-Network/soroban-guard-contracts"

[lib]
crate-type = ["cdylib"]

[dependencies]
soroban-sdk = { workspace = true }

[dev-dependencies]
soroban-sdk = { workspace = true, features = ["testutils"] }
